services:
  - type: web
    name: homekeeper
    runtime: python
    plan: starter
    buildCommand: bash build.sh
    preDeployCommand: cd backend && python manage.py migrate --noinput
    startCommand: cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    disk:
      name: homekeeper-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: MEDIA_ROOT
        value: /var/data
      - key: DATABASE_URL
        fromDatabase:
          name: homekeeper-db
          property: connectionString

  - type: cron
    name: homekeeper-warranty-reminders
    runtime: python
    plan: starter
    schedule: "0 2 * * *"
    buildCommand: pip install -r backend/requirements-prod.txt
    startCommand: cd backend && python manage.py send_warranty_reminders
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: homekeeper-db
          property: connectionString

databases:
  - name: homekeeper-db
    plan: 0.1c-256mb
    diskSizeGB: 1
